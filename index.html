<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Notas Históricas - Pollería Juárez</title>
    <!-- Tailwind para un diseño rápido y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para la generación y lectura de Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#af101a',
                        'primary-container': '#d32f2f',
                        'on-primary': '#ffffff',
                        background: '#f9f9f9',
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.background'); }
    </style>
</head>
<body class="text-gray-800 antialiased font-sans">
    <div class="max-w-6xl mx-auto mt-6 mb-16 px-4">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-primary">Captura Histórica de Notas</h1>
                <p class="text-gray-600 mt-1 text-sm md:text-base">Digitalización de notas de venta para análisis de datos (2020 - Actualidad).</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="clearData()" class="px-4 py-2 text-sm font-medium border border-red-300 text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                    Borrar Datos Locales
                </button>
                <label class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-md transition-colors flex items-center gap-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span>Cargar Excel</span>
                    <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" class="hidden" onchange="importFromExcel(event)">
                </label>
                <button onclick="exportToExcel()" class="px-4 py-2 text-sm font-medium bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-md transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span>Descargar Excel</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- Formulario de Captura -->
            <div class="lg:col-span-1 bg-surface p-6 rounded-2xl shadow-sm border border-gray-200 static lg:sticky lg:top-6">
                <div class="flex items-center justify-between mb-6 border-b pb-2">
                    <h2 class="text-xl font-semibold">Nueva Nota</h2>
                    <span class="text-xs text-primary font-medium bg-red-50 px-2 py-1 rounded">Autocalculable</span>
                </div>
                <form id="noteForm" onsubmit="saveNote(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Venta *</label>
                        <input type="date" id="fecha" required onchange="validateDateInput(this)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor</label>
                        <select id="proveedor" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-sm">
                            <option value="La luz">La luz</option>
                            <option value="El origen">El origen</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Piezas</label>
                            <input type="text" inputmode="decimal" id="piezas" placeholder="Ej. 173" oninput="formatNumberInput(this); autoCalculate('piezas');" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kilos Totales *</label>
                            <input type="text" inputmode="decimal" id="kilos" placeholder="Ej. 613.85" oninput="formatNumberInput(this); autoCalculate('kilos');" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-semibold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Precio Compra ($)</label>
                            <input type="text" inputmode="decimal" id="precio" placeholder="Ej. 34.50" oninput="formatNumberInput(this); autoCalculate('precio');" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Total a Pagar ($) *</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500 font-semibold">$</span>
                                <input type="text" inputmode="decimal" id="importe" required placeholder="18109.00" oninput="formatNumberInput(this); autoCalculate('importe');" class="w-full pl-8 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-lg font-bold text-primary">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-6 bg-primary text-white font-bold py-3 px-4 rounded-xl hover:bg-primary-container shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                        <span>Guardar Nota</span>
                        <span class="text-xs bg-red-800 text-red-100 px-2 py-0.5 rounded font-normal">Enter ↵</span>
                    </button>
                </form>
            </div>

            <!-- Tabla de Datos -->
            <div class="lg:col-span-2 bg-surface p-6 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                    <h2 class="text-xl font-semibold">Notas Capturadas (<span id="totalCount" class="text-primary font-bold">0</span>)</h2>
                    <div class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full w-fit">Ordenadas automáticamente por fecha</div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 text-gray-600 border-y border-gray-200">
                            <tr>
                                <th class="py-3 px-4">Fecha</th>
                                <th class="py-3 px-4">Folio</th>
                                <th class="py-3 px-4">Proveedor</th>
                                <th class="py-3 px-4 text-right">Piezas</th>
                                <th class="py-3 px-4 text-right">Kilos</th>
                                <th class="py-3 px-4 text-right">Precio</th>
                                <th class="py-3 px-4 text-right">Total ($)</th>
                                <th class="py-3 px-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-100">
                            <!-- Filas dinámicas -->
                        </tbody>
                        <tfoot class="bg-gray-50 border-y-2 border-gray-300 font-bold text-gray-800">
                            <tr>
                                <td colspan="3" class="py-3 px-4 text-right">TOTALES ACUMULADOS:</td>
                                <td id="sumPiezas" class="py-3 px-4 text-right">0</td>
                                <td id="sumKilos" class="py-3 px-4 text-right">0.00 kg</td>
                                <td class="py-3 px-4"></td>
                                <td id="sumImporte" class="py-3 px-4 text-right text-primary text-base">$0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Array principal en memoria
        let notas = [];

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            const todayStr = new Date().toISOString().split('T')[0];
            const fechaInput = document.getElementById('fecha');
            fechaInput.max = todayStr;
            // Si no hay fecha seleccionada o está en el futuro, poner por defecto el día actual
            if (!fechaInput.value || fechaInput.value > todayStr) {
                fechaInput.value = todayStr;
            }
            renderTable();
            document.getElementById('piezas').focus();
        });

        // Validación para impedir seleccionar o teclear fechas en el futuro
        function validateDateInput(input) {
            const todayStr = new Date().toISOString().split('T')[0];
            if (input.value > todayStr) {
                alert('No puedes seleccionar una fecha del futuro (' + formatDate(input.value) + '). Se ha restablecido a la fecha actual.');
                input.value = todayStr;
            }
        }

        // Limpieza y formateo de inputs numéricos (Soporta coma española como punto decimal)
        function formatNumberInput(input) {
            let val = input.value.replace(/,/g, '.'); // Convertir coma a punto decimal
            val = val.replace(/[^0-9.]/g, ''); // Solo números y punto
            val = val.replace(/(\..*?)\..*/g, '$1'); // Evitar múltiples puntos decimales
            input.value = val;
        }

        function getProveedorValue(nota) {
            return String(nota?.proveedor || nota?.cliente || 'La luz').trim();
        }

        // Autocalculadora inteligente entre Kilos, Precio e Importe
        function autoCalculate(changedField) {
            const kilos = parseFloat(document.getElementById('kilos').value) || 0;
            const precio = parseFloat(document.getElementById('precio').value) || 0;
            const importe = parseFloat(document.getElementById('importe').value) || 0;

            if (changedField === 'kilos' || changedField === 'precio') {
                if (kilos > 0 && precio > 0) {
                    document.getElementById('importe').value = (kilos * precio).toFixed(2);
                }
            } else if (changedField === 'importe') {
                if (kilos > 0 && importe > 0 && precio === 0) {
                    document.getElementById('precio').value = (importe / kilos).toFixed(2);
                }
            }
        }

        // Guardar nota
        function saveNote(e) {
            e.preventDefault();
            
            const fechaVal = document.getElementById('fecha').value;
            const todayStr = new Date().toISOString().split('T')[0];
            if (fechaVal > todayStr) {
                alert('No es posible registrar notas de fechas futuras (' + formatDate(fechaVal) + '). La fecha máxima permitida es hoy (' + formatDate(todayStr) + ').');
                document.getElementById('fecha').focus();
                return;
            }

            const kilosVal = parseFloat(document.getElementById('kilos').value) || 0;
            const importeVal = parseFloat(document.getElementById('importe').value) || 0;

            if (kilosVal <= 0 && importeVal <= 0) {
                alert('Por favor ingresa al menos los Kilos o el Importe total de la nota.');
                return;
            }

            // Calcular el siguiente folio de manera segura (evita errores con folios numéricos)
            let maxFolio = 0;
            notas.forEach(n => {
                if (n && n.folio) {
                    const folioStr = String(n.folio).trim();
                    if (folioStr.startsWith('HIST-')) {
                        const num = parseInt(folioStr.replace('HIST-', ''), 10);
                        if (!isNaN(num) && num > maxFolio) {
                            maxFolio = num;
                        }
                    }
                }
            });
            
            const nota = {
                id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 7),
                fecha: document.getElementById('fecha').value,
                folio: 'HIST-' + String(maxFolio + 1).padStart(5, '0'),
                proveedor: (document.getElementById('proveedor').value || 'La luz').trim(),
                piezas: parseFloat(document.getElementById('piezas').value) || 0,
                kilos: kilosVal,
                precio: parseFloat(document.getElementById('precio').value) || (kilosVal > 0 ? parseFloat((importeVal / kilosVal).toFixed(2)) : 0),
                importe: importeVal
            };

            notas.push(nota);
            
            // Ordenar por fecha cronológicamente (más antigua a más reciente)
            notas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            
            saveToLocalStorage();
            renderTable();
            
            // Limpiar formulario y enfocar en piezas para un flujo continuo
            document.getElementById('piezas').value = '';
            document.getElementById('kilos').value = '';
            document.getElementById('precio').value = '';
            document.getElementById('importe').value = '';
            document.getElementById('piezas').focus();
        }

        // Eliminar nota
        function deleteNote(id) {
            if(confirm('¿Seguro que deseas eliminar esta nota?')) {
                notas = notas.filter(n => String(n.id) !== String(id));
                saveToLocalStorage();
                renderTable();
            }
        }

        // Función de seguridad contra XSS para textos en tabla
        function escapeHtml(str) {
            if (str === null || str === undefined) return '-';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Renderizar tabla con precisión decimal robusta
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let totalPiezas = 0;
            let totalKilos = 0;
            let totalImporte = 0;

            if (notas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-gray-500 bg-gray-50/50 rounded-lg">No hay notas capturadas aún. Completa el formulario de la izquierda para comenzar.</td></tr>';
            }

            notas.forEach(nota => {
                totalPiezas += (parseFloat(nota.piezas) || 0);
                totalKilos += (parseFloat(nota.kilos) || 0);
                totalImporte += (parseFloat(nota.importe) || 0);

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-900">${escapeHtml(formatDate(nota.fecha))}</td>
                    <td class="py-3 px-4 text-gray-500 font-mono text-xs">${escapeHtml(nota.folio)}</td>
                    <td class="py-3 px-4 text-gray-700 text-xs truncate max-w-[150px]" title="${escapeHtml(getProveedorValue(nota))}">${escapeHtml(getProveedorValue(nota))}</td>
                    <td class="py-3 px-4 text-right">${nota.piezas > 0 ? Number.isInteger(nota.piezas) ? nota.piezas : nota.piezas.toFixed(2) : '-'}</td>
                    <td class="py-3 px-4 text-right font-medium">${nota.kilos > 0 ? nota.kilos.toFixed(2) : '-'}</td>
                    <td class="py-3 px-4 text-right text-gray-500">${nota.precio > 0 ? '$' + nota.precio.toFixed(2) : '-'}</td>
                    <td class="py-3 px-4 text-right font-bold text-gray-900">$${nota.importe.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteNote('${escapeHtml(nota.id)}')" title="Eliminar nota" class="text-red-500 hover:text-red-700 p-1.5 rounded-lg hover:bg-red-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Actualizar resumen inferior con redondeo seguro contra errores de coma flotante de JS
            document.getElementById('totalCount').innerText = notas.length;
            document.getElementById('sumPiezas').innerText = Number.isInteger(totalPiezas) ? totalPiezas : totalPiezas.toFixed(2);
            document.getElementById('sumKilos').innerText = totalKilos.toFixed(2) + ' kg';
            document.getElementById('sumImporte').innerText = '$' + totalImporte.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        // Exportar a Excel
        function exportToExcel() {
            if(notas.length === 0) {
                alert("No hay datos para exportar");
                return;
            }

            // Preparar datos para Excel con formato limpio y compatible para análisis (pandas, Laravel, tablas dinámicas)
            const excelData = notas.map(n => ({
                'ID': n.id,
                'Fecha': n.fecha || '', // ISO YYYY-MM-DD es estándar universal y ordenable en Excel
                'Fecha Formateada': formatDate(n.fecha),
                'Folio': n.folio,
                'Proveedor': getProveedorValue(n),
                'Piezas': Number(n.piezas) || 0,
                'Kilos': Number(n.kilos) || 0,
                'Precio ($)': Number(n.precio) || 0,
                'Importe ($)': Number(n.importe) || 0
            }));

            // Crear libro de trabajo
            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Notas Historicas");

            // Generar y descargar archivo
            const fileName = `Notas_Historicas_PJ_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // LocalStorage seguro
        function saveToLocalStorage() {
            try {
                localStorage.setItem('pj_historico_notas', JSON.stringify(notas));
            } catch(e) {
                console.error("Error al guardar en LocalStorage", e);
            }
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('pj_historico_notas');
            if (data) {
                try {
                    notas = JSON.parse(data);
                    if (!Array.isArray(notas)) notas = [];
                } catch(e) {
                    notas = [];
                }
            }
        }

        function clearData() {
            if(confirm('ATENCIÓN: Esto borrará todas las notas capturadas que no hayas exportado. ¿Estás absolutamente seguro?')) {
                notas = [];
                saveToLocalStorage();
                renderTable();
            }
        }

        // Helper para búsqueda flexible de nombres de columna en Excel
        function getRowValue(row, possibleNames) {
            const keys = Object.keys(row);
            for (const key of keys) {
                const cleanKey = key.trim().toLowerCase();
                for (const name of possibleNames) {
                    if (cleanKey === name.toLowerCase() || cleanKey.includes(name.toLowerCase())) {
                        return row[key];
                    }
                }
            }
            return undefined;
        }

        // Importar desde Excel de forma inteligente (resistente a diferencias de columnas y formatos)
        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const excelData = XLSX.utils.sheet_to_json(worksheet);
                    
                    let importedCount = 0;
                    let skippedCount = 0;
                    let futureCount = 0;
                    const todayStr = new Date().toISOString().split('T')[0];

                    excelData.forEach((row, idx) => {
                        const rawFecha = getRowValue(row, ['Fecha', 'date', 'dia']);
                        const rawImporte = getRowValue(row, ['Importe ($)', 'Importe', 'Total', 'monto']);
                        
                        if (rawFecha !== undefined && rawImporte !== undefined) {
                            const fechaStr = parseDate(rawFecha);
                            
                            if (fechaStr > todayStr) {
                                futureCount++;
                                return;
                            }

                            const kilosVal = parseFloat(getRowValue(row, ['Kilos', 'Kg', 'Peso'])) || 0;
                            const importeVal = parseFloat(rawImporte) || 0;
                            const folioVal = String(getRowValue(row, ['Folio', 'Nota', 'No']) || '-').trim();
                            
                            // Hash de respaldo único si el archivo Excel no tiene columna ID
                            const fallbackHash = 'MANUAL_' + folioVal + '_' + fechaStr + '_' + kilosVal + '_' + importeVal;
                            const rowId = row['ID'] ? String(row['ID']).trim() : fallbackHash.replace(/[^a-zA-Z0-9_-]/g, '');
                            
                            // Verificar duplicado por ID o por coincidencia exacta de datos
                            const exists = notas.some(n => {
                                if (String(n.id) === rowId) return true;
                                return n.fecha === fechaStr && n.folio === folioVal && n.kilos === kilosVal && n.importe === importeVal && kilosVal > 0;
                            });

                            if (exists) {
                                skippedCount++;
                                return;
                            }

                            const nota = {
                                id: rowId,
                                fecha: fechaStr,
                                folio: folioVal,
                                proveedor: String(getRowValue(row, ['Proveedor', 'Granja', 'Rancho', 'Cliente', 'Nombre', 'Comprador']) || 'La luz').trim(),
                                piezas: parseFloat(getRowValue(row, ['Piezas', 'Pzas', 'Cantidad', 'Cant'])) || 0,
                                kilos: kilosVal,
                                precio: parseFloat(getRowValue(row, ['Precio ($)', 'Precio', 'Costo', 'PU', 'P.U.'])) || (kilosVal > 0 ? parseFloat((importeVal / kilosVal).toFixed(2)) : 0),
                                importe: importeVal
                            };
                            notas.push(nota);
                            importedCount++;
                        }
                    });

                    if (importedCount > 0) {
                        notas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
                        saveToLocalStorage();
                        renderTable();
                        let msg = `¡Éxito! Se importaron ${importedCount} notas nuevas del archivo.`;
                        if (skippedCount > 0) {
                            msg += `\n(Se omitieron ${skippedCount} notas que ya estaban registradas para evitar duplicados).`;
                        }
                        if (futureCount > 0) {
                            msg += `\n(Se bloquearon ${futureCount} notas por tener fecha posterior a hoy).`;
                        }
                        alert(msg);
                    } else if (skippedCount > 0 || futureCount > 0) {
                        let msg = '';
                        if (skippedCount > 0) msg += `Todas las notas válidas (${skippedCount}) ya estaban cargadas en el sistema. `;
                        if (futureCount > 0) msg += `Se bloquearon ${futureCount} notas por tener fecha en el futuro.`;
                        alert(msg.trim());
                    } else {
                        alert('No se encontraron notas válidas en el archivo Excel. Verifica que tenga columnas de Fecha e Importe.');
                    }
                } catch(error) {
                    alert('Hubo un error procesando el archivo Excel. Asegúrate de que el formato sea válido (.xlsx, .xls o .csv).');
                    console.error(error);
                }
                
                event.target.value = '';
            };
            
            reader.readAsArrayBuffer(file);
        }

        // Utilidades robustas de Fecha
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = String(dateStr).split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return String(dateStr);
        }

        function parseDate(dateVal) {
            if (!dateVal) return '';
            
            // Si SheetJS devolvió un objeto Date de JavaScript
            if (dateVal instanceof Date && !isNaN(dateVal)) {
                return dateVal.toISOString().split('T')[0];
            }

            // Si es número serial de fecha de Excel (sistema 1900 con bug de año bisiesto)
            if (typeof dateVal === 'number') {
                const date = new Date((dateVal - 25569) * 86400 * 1000);
                const localDate = new Date(date.getTime() + date.getTimezoneOffset() * 60000);
                return localDate.toISOString().split('T')[0];
            }

            const str = String(dateVal).trim();
            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                    let p0 = parseInt(parts[0], 10);
                    let p1 = parseInt(parts[1], 10);
                    let p2 = parts[2];

                    // Determinar si es DD/MM/YYYY o MM/DD/YYYY
                    if (p0 > 12) {
                        // Formato DD/MM/YYYY (Estándar México)
                        return `${p2}-${String(p1).padStart(2, '0')}-${String(p0).padStart(2, '0')}`;
                    } else if (p1 > 12) {
                        // Formato MM/DD/YYYY (Estándar USA)
                        return `${p2}-${String(p0).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
                    } else {
                        // Por defecto asumir DD/MM/YYYY
                        return `${p2}-${String(p1).padStart(2, '0')}-${String(p0).padStart(2, '0')}`;
                    }
                }
            }

            return str;
        }
    </script>
